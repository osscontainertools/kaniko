version: "2"

run:
  build-tags:
    - otel
    - git
    - google
    - aws
    - azure

linters:
  default: standard
  enable:
    - copyloopvar
    - makezero
    - misspell
    - modernize
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
    modernize:
      disable:
        # flattening hides which embedded struct a field belongs to
        - embedlit
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
