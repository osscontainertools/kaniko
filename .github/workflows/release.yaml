name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  build-images:
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build.yaml

  release:
    needs: build-images
    permissions:
      packages: write
    runs-on: ubuntu-26.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOCKER_REPO: ${{ vars.DOCKERHUB_ORG }}/${{ vars.REPOSITORY_NAME || 'kaniko' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: imjasonh/setup-crane@v0.7

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Apply release tags
        run: |
          version=${GITHUB_REF/refs\/tags\//}

          # Must list every release-tag of the build-images matrix in build.yaml.
          for release_tag in latest debug slim slim-fips warmer bootstrap alpine; do
            if [[ "$release_tag" == "latest" ]]; then
              suffix=""
            else
              suffix="-$release_tag"
            fi
            digest=$(crane digest "$IMAGE:$GITHUB_SHA$suffix")
            for repo in "$IMAGE" "$DOCKER_REPO"; do
              crane cp "$IMAGE@$digest" "$repo:$version$suffix"
              crane cp "$IMAGE@$digest" "$repo:$release_tag"
            done
            crane cp "$IMAGE:sha256-${digest#sha256:}" "$DOCKER_REPO:sha256-${digest#sha256:}"
          done
