name: Integration tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_REPO: 'localhost:5000'
      REGISTRY: 'localhost:5000'
      COVERAGE_DIR: '${{ github.workspace }}/out/covdata'
      KANIKO_TELEMETRY_ENDPOINT: '${{ vars.KANIKO_TELEMETRY_ENDPOINT }}'
      KANIKO_TELEMETRY_TOKEN_EXCHANGE_ENDPOINT: '${{ vars.KANIKO_TELEMETRY_TOKEN_EXCHANGE_ENDPOINT }}'

    strategy:
      fail-fast: false
      matrix:
        make-target:
          - integration-test-layers
          - integration-test-misc
          - integration-test-run
          - k8s-executor-build-push integration-test-k8s

    steps:
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.3'

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-docker-action@v5.7.0
        with:
          version: 29.9.3

      - run: make k3s-setup
      - run: make ${{ matrix.make-target }}

      - name: Convert and upload coverage
        run: |
          go tool covdata textfmt -i out/covdata -o coverage.txt

      - uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
