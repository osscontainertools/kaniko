name: Build images

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

env:
  DOCKER_REPO: ${{ vars.DOCKERHUB_ORG }}/${{ vars.REPOSITORY_NAME || 'kaniko' }}

permissions: {}

jobs:
  build-images:
    concurrency:
      # If a previous run is ongoing with the same head_ref (it's a run on the
      # same PR) then cancel it to save time. If it isn't a PR, only cancel the
      # previous run if it's on the same commit SHA and workflow ref. This prevents
      # a run for a commit push or release tag from cancelling a previous commit
      # push's build, since we want an image built and tagged for each commit.
      group: build-images-${{ matrix.image }}-${{ github.ref }}-${{ github.head_ref || github.sha }}
      cancel-in-progress: true

    permissions:
      contents: read  # Read the repo contents.
      id-token: write # Produce identity token for keyless signing.
      packages: write # push to ghcr registry

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - executor
          - executor-debug
          - executor-slim
          - warmer
          - bootstrap
          - alpine

        include:
          - image: executor
            target: kaniko-executor
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}
            release-tag: latest

          - image: executor-debug
            target: kaniko-debug
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-debug
            release-tag: debug

          - image: executor-slim
            target: kaniko-slim
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-slim
            release-tag: slim

          - image: warmer
            target: kaniko-warmer
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-warmer
            release-tag: warmer

          - image: bootstrap
            target: kaniko-debug-2
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-bootstrap
            release-tag: bootstrap

          - image: alpine
            target: kaniko-alpine
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-alpine
            release-tag: alpine

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Define build context
        id: context
        run: |
          SHOULD_PUSH=${{ github.event_name != 'pull_request' }}
          case "${{ github.ref }}" in
            refs/tags/v*)
              IMAGE_NAME=ghcr.io/${{ github.repository }}
              IS_RELEASE=true
              ;;
            *)
              IMAGE_NAME=ghcr.io/${{ github.repository }}-dev
              IS_RELEASE=false
            ;;
          esac
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "should_push=$SHOULD_PUSH" >> $GITHUB_OUTPUT

      - id: platforms
        run: |
          if [[ "${{ steps.context.outputs.should_push }}" != "true" ]]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "platforms=${{ matrix.platforms }}" >> $GITHUB_OUTPUT
          fi

      - if: steps.context.outputs.should_push == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platforms }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set build timestamp
        id: build-time
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "epoch=$epoch" >> $GITHUB_OUTPUT
          echo "created=$(date -u -d @$epoch +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - if: steps.context.outputs.should_push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single build exported locally with provenance+SBOM → verify → push → re-attach.
      # PRs (should_push=false): build+verify only, no registry push.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-time.outputs.epoch }}
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          # type=local writes provenance.json/sbom.spdx.json for verification.
          # type=oci,tar=false produces a pushable OCI layout directory (index).
          outputs: |
            type=local,dest=${{ runner.temp }}/kaniko-export/
            type=oci,tar=false,dest=${{ runner.temp }}/kaniko-image
          tags: ${{ steps.context.outputs.image_name }}:${{ matrix.tag }}
          # https://github.com/docker/build-push-action/blob/master/docs/advanced/cache.md#github-cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: ${{ matrix.target }}
          # SBOM alongside provenance.
          attests: |
            type=provenance,mode=max
            "type=sbom,""SELECT_CATALOGERS=image,file,+sbom-cataloger,-binary-classifier-cataloger"""
          labels: |
            org.opencontainers.image.created=${{ steps.build-time.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/#readme
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ steps.context.outputs.image_name }}:${{ matrix.release-tag }}
            org.opencontainers.image.description=Build container images in Kubernetes
            org.opencontainers.image.version=${{ steps.context.outputs.is_release == 'true' && github.ref_name || github.sha }}
          annotations: |
            index,manifest:org.opencontainers.image.created=${{ steps.build-time.outputs.created }}
            index,manifest:org.opencontainers.image.authors=${{ github.repository_owner }}
            index,manifest:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/#readme
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.vendor=${{ github.repository_owner }}
            index,manifest:org.opencontainers.image.licenses=Apache-2.0
            index,manifest:org.opencontainers.image.title=${{ steps.context.outputs.image_name }}:${{ matrix.release-tag }}
            index,manifest:org.opencontainers.image.description=Build container images in Kubernetes
            index,manifest:org.opencontainers.image.version=${{ steps.context.outputs.is_release == 'true' && github.ref_name || github.sha }}

      - name: Check expected-dependencies manifest is up to date
        run: make check-expected-dependencies

      - name: Verify provenance against manifest
        env:
          # Fail if any platform's provenance file is missing from the export.
          EXPECTED_PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: ./scripts/verify-provenance.sh "${{ runner.temp }}/kaniko-export" deploy/expected-dependencies.json

      # Push only reached if verify passed. Uses crane to preserve multi-platform.
      - if: steps.context.outputs.should_push == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - if: steps.context.outputs.should_push == 'true'
        name: Push verified image
        id: build-and-push
        run: |
          set -euo pipefail
          REF="${{ steps.context.outputs.image_name }}:${{ matrix.tag }}"
          crane push "${{ runner.temp }}/kaniko-image" "$REF"
          DIGEST=$(crane digest "$REF")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $REF@$DIGEST"

      # Re-attach + sign attestations (keyless). Preserve the
      # full BuildKit in-toto statements per platform from the OCI layout, bind each to
      # the matching pushed platform manifest, and verify signature + predicate + subject.
      - if: steps.context.outputs.should_push == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - if: steps.context.outputs.should_push == 'true'
        name: Attach attestations and sign image
        env:
          EXPORT: ${{ runner.temp }}/kaniko-export
          OCI_LAYOUT: ${{ runner.temp }}/kaniko-image
          IMAGE_REPO: ${{ steps.context.outputs.image_name }}
          PUSHED_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          ISSUER: https://token.actions.githubusercontent.com
          IDENTITY_RE: '.*'
          EXPECTED_PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          set -euo pipefail
          INDEX_IMAGE="${IMAGE_REPO}@${PUSHED_DIGEST}"
          # Sign the pushed image index (preserves existing behavior).
          cosign sign --yes "$INDEX_IMAGE"

          python3 - "$OCI_LAYOUT" "$IMAGE_REPO" "$ISSUER" "$IDENTITY_RE" "$EXPECTED_PLATFORMS" <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys
          import tempfile

          layout, repo, issuer, identity_re, expected_platforms_raw = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]

          expected_platforms = [p.strip() for p in expected_platforms_raw.split(',') if p.strip()]
          if not expected_platforms:
              raise SystemExit('no expected platforms provided')
          verified_by_platform = {p: 0 for p in expected_platforms}

          def normalize_platform(p):
              if not p:
                  return None
              os_name = p.get('os') or 'linux'
              arch = p.get('architecture') or ''
              variant = p.get('variant') or ''
              if arch in ('', 'unknown') or os_name in ('', 'unknown'):
                  return None
              name = f"{os_name}/{arch}"
              if variant:
                  name += f"/{variant}"
              return name

          def load_blob(digest):
              algo, h = digest.split(':', 1)
              with open(os.path.join(layout, 'blobs', algo, h), 'rb') as f:
                  return f.read()

          def decode_attestation_payloads(verify_output):
              stmts = []
              for line in verify_output.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  payload = obj.get('payload')
                  if not payload:
                      continue
                  try:
                      decoded = base64.b64decode(payload)
                      stmts.append(json.loads(decoded))
                  except Exception:
                      continue
              return stmts

          with open(os.path.join(layout, 'index.json')) as f:
              idx = json.load(f)

          # Map attested image manifest digest -> platform from non-attestation descriptors.
          digest_to_platform = {}

          def collect_platforms(manifests, depth=0):
              if depth > 8:
                  return
              for m in manifests or []:
                  mt = m.get('mediaType', '')
                  if 'index' in mt:
                      doc = json.loads(load_blob(m['digest']))
                      collect_platforms(doc.get('manifests') or [], depth + 1)
                      continue
                  ref = (m.get('annotations') or {}).get('vnd.docker.reference.type')
                  if ref == 'attestation-manifest':
                      continue
                  pnorm = normalize_platform(m.get('platform') or {})
                  if pnorm and m.get('digest'):
                      digest_to_platform[m['digest']] = pnorm

          def walk(manifests, depth=0):
              if depth > 8:
                  return
              for m in manifests or []:
                  mt = m.get('mediaType', '')
                  if 'index' in mt:
                      doc = json.loads(load_blob(m['digest']))
                      walk(doc.get('manifests') or [], depth + 1)
                      continue
                  ref = (m.get('annotations') or {}).get('vnd.docker.reference.type')
                  if ref != 'attestation-manifest':
                      continue
                  am = json.loads(load_blob(m['digest']))
                  subj = am.get('subject') or {}
                  subject_digest = subj.get('digest')
                  attestation_platform = (m.get('platform') or {})
                  if not subject_digest:
                      raise SystemExit(f"attestation manifest missing subject digest: {m.get('digest')}")
                  target = f"{repo}@{subject_digest}"
                  want = subject_digest.split(':', 1)[1]
                  for layer in (am.get('layers') or []):
                      ann = layer.get('annotations') or {}
                      ptype = ann.get('in-toto.io/predicate-type', '')
                      if 'slsa.dev/provenance' not in ptype:
                          continue
                      blob = load_blob(layer['digest'])
                      stmt = json.loads(blob)
                      # Ensure the BuildKit statement binds to the matching platform manifest.
                      subj_digests = [s.get('digest', {}).get('sha256') for s in (stmt.get('subject') or []) if isinstance(s, dict)]
                      if want not in subj_digests:
                          raise SystemExit(f"statement subject {subj_digests} does not bind to attested manifest {subject_digest}")

                      # Use the original predicate and predicate type from BuildKit; cosign attest
                      # expects a predicate and will wrap it with its own subject/predicateType,
                      # but we must supply the exported predicate verbatim and verify the resulting
                      # statement matches that predicate exactly.
                      predicate = stmt.get('predicate', stmt)
                      if isinstance(stmt, dict) and '_type' not in stmt and 'buildDefinition' in stmt and 'predicate' not in stmt:
                          predicate = stmt
                      pred_type = stmt.get('predicateType') or ann.get('in-toto.io/predicate-type') or 'https://slsa.dev/provenance/v1'
                      pred_path = None
                      try:
                          with tempfile.NamedTemporaryFile('w', suffix='.predicate.json', delete=False) as tf:
                              json.dump(predicate, tf)
                              pred_path = tf.name
                          subprocess.run([
                              'cosign', 'attest', '--yes',
                              '--type', pred_type,
                              '--predicate', pred_path,
                              target,
                          ], check=True)
                          out = subprocess.check_output([
                              'cosign', 'verify-attestation',
                              '--type', pred_type,
                              '--certificate-oidc-issuer', issuer,
                              '--certificate-identity-regexp', identity_re,
                              target,
                          ], text=True)
                          verified = decode_attestation_payloads(out)
                          ok = False
                          for vstmt in verified:
                              vptype = vstmt.get('predicateType', '')
                              vsubs = [s.get('digest', {}).get('sha256') for s in (vstmt.get('subject') or []) if isinstance(s, dict)]
                              vp = vstmt.get('predicate')
                              if vptype == pred_type and want in vsubs and vp == predicate:
                                  ok = True
                                  break
                          if not ok:
                              raise SystemExit(f"verified attestation payload predicate/predicateType/subject mismatch for {target} (expected predicateType={pred_type})")
                      finally:
                          if pred_path and os.path.exists(pred_path):
                              os.unlink(pred_path)
                      # Resolve platform from the attested image manifest (not attestation descriptor).
                      pnorm = digest_to_platform.get(subject_digest) or normalize_platform(attestation_platform)
                      if pnorm in verified_by_platform:
                          verified_by_platform[pnorm] += 1
                      elif len(expected_platforms) == 1 and pnorm is None:
                          # single-arch attestation manifests may lack explicit platform
                          verified_by_platform[expected_platforms[0]] += 1
                      print(f"OK: signed+verified provenance for {target} platform={pnorm or 'unknown'}")

          collect_platforms(idx.get('manifests') or [])
          walk(idx.get('manifests') or [])

          missing = [p for p, c in verified_by_platform.items() if c < 1]
          if missing:
              raise SystemExit(f"missing verified provenance for expected platform(s): {', '.join(missing)} (verified={verified_by_platform})")
          print(f"OK: verified provenance for all expected platforms: {verified_by_platform}")
          PY

          # For a multi-arch index, attestations are per-platform (verified above). For a
          # single-arch image the index and manifest may coincide. Best-effort index check:
          if out=$(cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity-regexp "$IDENTITY_RE" \
            "$INDEX_IMAGE" 2>&1); then
            echo "OK: provenance attestation verified for index $INDEX_IMAGE"
          else
            if echo "$out" | grep -qi 'no matching attestations'; then
              echo "INFO: no direct provenance attestation on index $INDEX_IMAGE (per-platform attestations verified above)"
            else
              echo "WARN: index-level provenance verification failed for $INDEX_IMAGE (per-platform attestations verified above):" >&2
              echo "$out" >&2
            fi
          fi

          python3 - "$EXPORT" "$OCI_LAYOUT" "$IMAGE_REPO" "$ISSUER" "$IDENTITY_RE" "$EXPECTED_PLATFORMS" <<'PY'
          import base64
          import glob
          import json
          import os
          import subprocess
          import sys
          import tempfile

          export_dir, layout, repo, issuer, identity_re, expected_platforms_raw = sys.argv[1:7]
          expected_platforms = [p.strip() for p in expected_platforms_raw.split(',') if p.strip()]

          def normalize_platform(p):
              if not p:
                  return None
              os_name = p.get('os') or 'linux'
              arch = p.get('architecture') or ''
              variant = p.get('variant') or ''
              if arch in ('', 'unknown') or os_name in ('', 'unknown'):
                  return None
              name = f"{os_name}/{arch}"
              if variant:
                  name += f"/{variant}"
              return name

          def load_blob(digest):
              algo, h = digest.split(':', 1)
              with open(os.path.join(layout, 'blobs', algo, h), 'rb') as f:
                  return f.read()

          with open(os.path.join(layout, 'index.json')) as f:
              idx = json.load(f)

          digest_to_platform = {}
          platform_to_digest = {}

          def collect_platforms(manifests, depth=0):
              if depth > 8:
                  return
              for m in manifests or []:
                  mt = m.get('mediaType', '')
                  if 'index' in mt:
                      doc = json.loads(load_blob(m['digest']))
                      collect_platforms(doc.get('manifests') or [], depth + 1)
                      continue
                  ref = (m.get('annotations') or {}).get('vnd.docker.reference.type')
                  if ref == 'attestation-manifest':
                      continue
                  pnorm = normalize_platform(m.get('platform') or {})
                  if pnorm and m.get('digest'):
                      digest_to_platform[m['digest']] = pnorm
                      platform_to_digest[pnorm] = m['digest']

          collect_platforms(idx.get('manifests') or [])

          # Find all exported SBOMs
          sbom_files = sorted(set(glob.glob(os.path.join(export_dir, '**', 'sbom*.spdx.json'), recursive=True) +
                                   glob.glob(os.path.join(export_dir, '**', 'sbom*.json'), recursive=True) +
                                   glob.glob(os.path.join(export_dir, 'sbom*.spdx.json')) +
                                   glob.glob(os.path.join(export_dir, 'sbom*.json'))))
          # filter to likely spdx
          sbom_files = [p for p in sbom_files if os.path.isfile(p)]

          if not sbom_files:
              print('WARN: no sbom*.json found in export (SBOM should be preserved; review)')
              sys.exit(0)

          def decode_attestation_payloads(verify_output):
              stmts = []
              for line in verify_output.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  payload = obj.get('payload')
                  if not payload:
                      continue
                  try:
                      decoded = base64.b64decode(payload)
                      stmts.append(json.loads(decoded))
                  except Exception:
                      continue
              return stmts

          def match_target(path, stmt_or_doc):
              # 1) in-toto statement subject digest
              if isinstance(stmt_or_doc, dict) and stmt_or_doc.get('_type','').startswith('https://in-toto.io/Statement'):
                  subs = stmt_or_doc.get('subject') or []
                  for sub in subs:
                      d = (sub.get('digest') or {}).get('sha256')
                      if d:
                          cand = 'sha256:' + d
                          if cand in digest_to_platform:
                              return cand, digest_to_platform[cand]
              # 2) platform hint in filename/path
              low = path.lower().replace('\\', '/')
              for plat, dig in platform_to_digest.items():
                  key = plat.replace('/', '-')
                  if key in low or plat in low:
                      return dig, plat
                  # also try arch-only tokens
                  arch = plat.split('/')
                  if len(arch) >= 2 and arch[1] in low:
                      # avoid ambiguous matches
                      matches = [p for p in platform_to_digest if p.split('/')[1] == arch[1]]
                      if len(matches) == 1:
                          d2 = platform_to_digest[matches[0]]
                          return d2, matches[0]
              # 3) single platform/exported image
              if len(platform_to_digest) == 1:
                  plat, dig = next(iter(platform_to_digest.items()))
                  return dig, plat
              return None, None

          attested = set()
          for path in sbom_files:
              with open(path) as f:
                  obj = json.load(f)
              if isinstance(obj, dict) and obj.get('_type','').startswith('https://in-toto.io/Statement') and 'predicate' in obj:
                  pred = obj['predicate']
                  stmt_like = obj
              else:
                  pred = obj
                  stmt_like = obj
              target_digest, pnorm = match_target(path, stmt_like)
              if not target_digest:
                  raise SystemExit(f'could not match SBOM to a platform manifest: {path} (known platforms={sorted(platform_to_digest)})')
              target = f"{repo}@{target_digest}"
              with tempfile.NamedTemporaryFile('w', suffix='.spdx.json', delete=False) as tf:
                  json.dump(pred, tf)
                  pred_path = tf.name
              verify_out = None
              try:
                  subprocess.run(['cosign', 'attest', '--yes', '--type', 'spdx', '--predicate', pred_path, target], check=True)
                  verify_out = subprocess.check_output([
                      'cosign', 'verify-attestation', '--type', 'spdx',
                      '--certificate-oidc-issuer', issuer,
                      '--certificate-identity-regexp', identity_re,
                      target,
                  ], text=True)
              finally:
                  os.unlink(pred_path)
              ok = False
              for vstmt in decode_attestation_payloads(verify_out or ''):
                  vpred = vstmt.get('predicate') or {}
                  vsubs = [s.get('digest', {}).get('sha256') for s in (vstmt.get('subject') or []) if isinstance(s, dict)]
                  want = target_digest.split(':', 1)[1]
                  if isinstance(vpred, dict) and vpred.get('spdxVersion') and vpred.get('SPDXID') and vpred.get('dataLicense') and want in vsubs:
                      ok = True
                      break
              if not ok:
                  raise SystemExit(f'verified SBOM attestation missing valid SPDX predicate schema/subject for {target} (from {path})')
              attested.add(pnorm or target_digest)
              print(f'OK: SBOM attested+verified for {target} platform={pnorm or "unknown"} ({os.path.basename(path)})')

          # ensure coverage for expected platforms when known
          if expected_platforms and platform_to_digest:
              missing = [p for p in expected_platforms if platform_to_digest.get(p) and p not in attested]
              # if a platform manifest exists but got no SBOM, fail
              if missing:
                  raise SystemExit(f'missing SBOM attestation for expected platform(s): {", ".join(missing)}')
          print(f'OK: SBOM attestations verified for {len(attested)} platform manifest(s)')
          PY

          echo "OK: provenance signed and verified for all expected platforms (predicate+subject+signature) for $INDEX_IMAGE (pushed digest $PUSHED_DIGEST)"

      # If a tag push, use crane to add more tags.
      - if: steps.context.outputs.is_release == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - if: steps.context.outputs.is_release == 'true'
        name: Apply release tags
        run: |
          tag=${GITHUB_REF/refs\/tags\//}

          # Tag :latest, :debug, :slim
          crane cp ${{ steps.context.outputs.image_name }}@${{ steps.build-and-push.outputs.digest }} \
              ${{ steps.context.outputs.image_name }}:${{ matrix.release-tag }}

          if [[ "${{ matrix.release-tag }}" == "latest" ]]; then
            # Tag :latest images as :v1.X.Y
            crane cp ${{ steps.context.outputs.image_name }}@${{ steps.build-and-push.outputs.digest }} \
                ${{ steps.context.outputs.image_name }}:${tag}
          else
            # Or tag :v1.X.Y-debug and :v1.X.Y-slim
            crane cp ${{ steps.context.outputs.image_name }}@${{ steps.build-and-push.outputs.digest }} \
                ${{ steps.context.outputs.image_name }}:${tag}-${{ matrix.release-tag }}
          fi

      # If a tag push, distribute to other registries too
      - if: steps.context.outputs.is_release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.context.outputs.is_release == 'true'
        name: Distribute to Docker hub
        run: |
          tag=${GITHUB_REF/refs\/tags\//}

          # Tag :latest, :debug, :slim
          crane cp ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }} \
              ${{ env.DOCKER_REPO }}:${{ matrix.release-tag }}

          if [[ "${{ matrix.release-tag }}" == "latest" ]]; then
            crane cp ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }} \
                ${{ env.DOCKER_REPO }}:${tag}
          else
            crane cp ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }} \
                ${{ env.DOCKER_REPO }}:${tag}-${{ matrix.release-tag }}
          fi

      - if: steps.context.outputs.is_release == 'true'
        name: Sign Docker Hub images
        run: |
          cosign sign --yes \
              --sign-container-identity ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }} \
              ${{ env.DOCKER_REPO }}@${{ steps.build-and-push.outputs.digest }}
