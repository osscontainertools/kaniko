name: Build images

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions: {}

jobs:
  build-images:
    concurrency:
      # If a previous run is ongoing with the same head_ref (it's a run on the
      # same PR) then cancel it to save time. If it isn't a PR, only cancel the
      # previous run if it's on the same commit SHA and workflow ref. This prevents
      # a run for a commit push or release tag from cancelling a previous commit
      # push's build, since we want an image built and tagged for each commit.
      group: build-images-${{ matrix.image }}-${{ github.ref }}-${{ github.head_ref || github.sha }}
      cancel-in-progress: true

    permissions:
      contents: read  # Read the repo contents.
      id-token: write # Produce identity token for keyless signing.
      packages: write # push to ghcr registry
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - executor
          - executor-debug
          - executor-slim
          - executor-slim-fips
          - warmer
          - bootstrap
          - alpine

        include:
          - image: executor
            target: kaniko-executor
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}
            release-tag: latest

          - image: executor-debug
            target: kaniko-debug
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-debug
            release-tag: debug

          - image: executor-slim
            target: kaniko-slim
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-slim
            release-tag: slim

          - image: executor-slim-fips
            target: kaniko-slim-fips
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-slim-fips
            release-tag: slim-fips

          - image: warmer
            target: kaniko-warmer
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-warmer
            release-tag: warmer

          - image: bootstrap
            target: kaniko-debug-2
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-bootstrap
            release-tag: bootstrap

          - image: alpine
            target: kaniko-alpine
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/s390x,linux/riscv64,linux/ppc64le
            tag: ${{ github.sha }}-alpine
            release-tag: alpine

    uses: ./.github/workflows/build.yaml
    with:
      target: ${{ matrix.target }}
      platforms: ${{ matrix.platforms }}
      tag: ${{ matrix.tag }}
      release-tag: ${{ matrix.release-tag }}

  # If a tag push, distribute to other registries too
  dockerhub:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-images
    permissions:
      packages: read
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOCKER_REPO: ${{ vars.DOCKERHUB_ORG }}/${{ vars.REPOSITORY_NAME || 'kaniko' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: imjasonh/setup-crane@v0.7

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Distribute to Docker hub
        run: |
          version=${GITHUB_REF/refs\/tags\//}

          # Must list every release-tag of the build-images matrix.
          for release_tag in latest debug slim slim-fips warmer bootstrap alpine; do
            if [[ "$release_tag" == "latest" ]]; then
              tag=$version
            else
              tag=$version-$release_tag
            fi
            digest=$(crane digest "$IMAGE:$tag")
            crane cp "$IMAGE@$digest" "$DOCKER_REPO:$tag"
            crane cp "$IMAGE@$digest" "$DOCKER_REPO:$release_tag"
            crane cp "$IMAGE:sha256-${digest#sha256:}" "$DOCKER_REPO:sha256-${digest#sha256:}"
          done
