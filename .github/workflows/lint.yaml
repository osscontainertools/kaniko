name: Lint

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:
  actions-lock:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --no-fix

  vet:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'

      - name: Vet the slim build
        run: go vet ./pkg/... ./cmd/...

  golangci-lint:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'

      - name: Run golangci-lint
        run: make lint
