name: Provenance

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image:
        required: true
        type: string
      digest:
        required: true
        type: string
    secrets:
      dockerhub-token:
        required: false

permissions: {}

jobs:
  attest:
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry == 'docker.io' && vars.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ inputs.registry == 'docker.io' && secrets.dockerhub-token || secrets.GITHUB_TOKEN }}

      - uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
