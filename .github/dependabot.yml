---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    allow:
      - dependency-type: all
    groups:
      gomod:
        update-types:
          - "patch"

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    allow:
      - dependency-type: all

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directories:
      - /deploy
      - /.devcontainer
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
