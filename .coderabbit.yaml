knowledge_base:
  code_guidelines:
    filePatterns:
      - CONTRIBUTING.md
      - DEVELOPMENT.md
      - files: "docs/coding-guidelines.md,docs/principles.md,docs/releases.md,docs/testplan.md"
        applyTo: "**"
reviews:
  path_filters:
    - "!vendor/**"
  path_instructions:
    - path: "deploy/Dockerfile"
      instructions: |
        DOCKER_CREDENTIAL_GCR_CONFIG is a filesystem path, not a credential.
        Do not report this setting as a hardcoded secret unless an actual
        credential value or credential file is embedded.
    - path: "pkg/config/featureflags.go"
      instructions: |
        New flags need a README entry and a `KanikoEnv` entry in integration/images.go.
    - path: "golden/testdata/**/plans/*"
      instructions: |
        Generated by `UPDATE=1 make golden`.
